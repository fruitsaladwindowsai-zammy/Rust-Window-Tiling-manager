<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow6" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="springCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="physicsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <style>
    @keyframes waveDash {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes springBounce {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(80px); }
      50% { transform: translateX(-30px); }
      70% { transform: translateX(12px); }
      85% { transform: translateX(-4px); }
    }
    .anim-wave { stroke-dasharray: 600; animation: waveDash 3.5s infinite ease-out; }
    .anim-mass { animation: springBounce 4s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
    
    text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="750" fill="url(#bgGlow6)"/>

  <!-- Top Title Badge -->
  <g transform="translate(600, 48)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="rgba(14, 20, 32, 0.95)" stroke="url(#springCyan)" stroke-width="1.5"/>
    <circle cx="-230" cy="0" r="5" fill="#00f5d4"/>
    <text x="-215" y="4" fill="#f8fafc" font-size="12" font-weight="700">120Hz Underdamped Mass-Spring Physics Engine</text>
    <text x="185" y="4" fill="#00f5d4" font-size="10" class="mono" font-weight="bold">F=-kx-cv</text>
  </g>

  <!-- Left: Physical Mass-Spring System Schematic -->
  <g transform="translate(100, 110)" filter="url(#physicsShadow)">
    <rect width="480" height="520" rx="16" fill="#0c1220" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <rect x="15" y="15" width="450" height="32" rx="8" fill="#151e32"/>
    <text x="30" y="36" fill="#00f5d4" font-size="12" font-weight="bold">MECHANICAL OSCILLATOR MODEL</text>
    <rect x="360" y="21" width="90" height="20" rx="10" fill="rgba(0, 245, 212, 0.15)"/>
    <text x="405" y="35" fill="#00f5d4" font-size="9" class="mono" text-anchor="middle">120 FPS SYNC</text>

    <!-- Wall Anchor -->
    <rect x="40" y="80" width="20" height="200" rx="4" fill="#1f293d" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <line x1="40" y1="90" x2="25" y2="105" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="25" y2="145" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <line x1="40" y1="170" x2="25" y2="185" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <line x1="40" y1="210" x2="25" y2="225" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <line x1="40" y1="250" x2="25" y2="265" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>

    <!-- Spring Coil -->
    <path d="M 60 140 L 90 140 L 105 120 L 125 160 L 145 120 L 165 160 L 185 120 L 205 160 L 220 140 L 250 140" fill="none" stroke="#00f5d4" stroke-width="3" filter="url(#waveGlow)"/>
    <text x="155" y="105" fill="#00f5d4" font-size="11" class="mono" font-weight="bold" text-anchor="middle">Stiffness k = 380</text>

    <!-- Viscous Damper (Dashpot) -->
    <g transform="translate(60, 220)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#a855f7" stroke-width="2.5"/>
      <!-- Cylinder -->
      <rect x="50" y="-18" width="70" height="36" rx="4" fill="none" stroke="#a855f7" stroke-width="2"/>
      <!-- Piston rod -->
      <line x1="85" y1="0" x2="190" y2="0" stroke="#a855f7" stroke-width="2.5"/>
      <rect x="80" y="-12" width="6" height="24" rx="2" fill="#c084fc"/>
      <text x="95" y="-24" fill="#c084fc" font-size="11" class="mono" font-weight="bold" text-anchor="middle">Damping c = 24</text>
    </g>

    <!-- Animated Mass Block (Moving Window Simulation) -->
    <g transform="translate(310, 100)" class="anim-mass">
      <rect width="130" height="180" rx="10" fill="#162238" stroke="#00f5d4" stroke-width="2" filter="url(#waveGlow)"/>
      <rect x="10" y="10" width="110" height="24" rx="4" fill="#0e1726"/>
      <text x="65" y="26" fill="#00f5d4" font-size="9" class="mono" font-weight="bold" text-anchor="middle">Mass m = 1.0</text>
      <text x="65" y="65" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Active Window</text>
      <text x="65" y="85" fill="#94a3b8" font-size="9" class="mono" text-anchor="middle">(Camera Target)</text>
      <circle cx="65" cy="130" r="20" fill="#0a0f1d" stroke="#00f5d4" stroke-width="1.5"/>
      <text x="65" y="136" font-size="16" text-anchor="middle">🪟</text>
    </g>

    <!-- Physics Equations Panel -->
    <g transform="translate(25, 320)">
      <rect width="430" height="170" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="32" fill="#00f5d4" font-size="12" class="mono" font-weight="bold">Differential Equation of Motion:</text>
      <text x="20" y="58" fill="#f8fafc" font-size="14" class="mono">m · d²x/dt² + c · dx/dt + k · x = 0</text>
      <rect x="20" y="75" width="390" height="1" fill="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="102" fill="#94a3b8" font-size="10" class="mono">Natural Frequency ω_n = √(k/m) = 19.49 rad/s</text>
      <text x="20" y="125" fill="#94a3b8" font-size="10" class="mono">Damping Ratio ζ = c / (2√(mk)) = 0.62 (Underdamped)</text>
      <text x="20" y="148" fill="#10b981" font-size="10" class="mono" font-weight="bold">Settling Time t_s = 4 / (ζ·ω_n) ≈ 184 ms</text>
    </g>
  </g>

  <!-- Right: Live Oscilloscope Wave Comparison -->
  <g transform="translate(620, 110)" filter="url(#physicsShadow)">
    <rect width="480" height="520" rx="16" fill="#0c1220" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <rect x="15" y="15" width="450" height="32" rx="8" fill="#151e32"/>
    <text x="30" y="36" fill="#c084fc" font-size="12" font-weight="bold">OSCILLOSCOPE WAVE COMPARISON</text>
    <rect x="360" y="21" width="90" height="20" rx="10" fill="rgba(192, 132, 252, 0.15)"/>
    <text x="405" y="35" fill="#c084fc" font-size="9" class="mono" text-anchor="middle">REAL-TIME</text>

    <!-- Graph Screen -->
    <g transform="translate(25, 65)">
      <rect width="430" height="260" rx="10" fill="#060911" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      
      <!-- Grid lines -->
      <line x1="0" y1="65" x2="430" y2="65" stroke="rgba(255, 255, 255, 0.05)"/>
      <line x1="0" y1="130" x2="430" y2="130" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="4 4"/>
      <line x1="0" y1="195" x2="430" y2="195" stroke="rgba(255, 255, 255, 0.05)"/>
      
      <line x1="107" y1="0" x2="107" y2="260" stroke="rgba(255, 255, 255, 0.05)"/>
      <line x1="215" y1="0" x2="215" y2="260" stroke="rgba(255, 255, 255, 0.05)"/>
      <line x1="322" y1="0" x2="322" y2="260" stroke="rgba(255, 255, 255, 0.05)"/>

      <!-- Target line -->
      <text x="15" y="125" fill="#00f5d4" font-size="9" class="mono">Target Position (1.0)</text>

      <!-- Wave A: Linear Lerp (Standard WM) -->
      <path d="M 0 230 L 210 130 L 430 130" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="220" y="150" fill="#64748b" font-size="9" class="mono">Linear Lerp (Sluggish)</text>

      <!-- Wave B: WinScroller 2D Damped Harmonic Oscillation -->
      <path d="M 0 230 Q 70 30 130 90 T 210 140 T 280 128 T 350 130 L 430 130" fill="none" stroke="#00f5d4" stroke-width="3" filter="url(#waveGlow)" class="anim-wave"/>
      <text x="140" y="80" fill="#00f5d4" font-size="9" class="mono" font-weight="bold">WinScroller 2D 120Hz Spring (Visceral)</text>
    </g>

    <!-- Benchmark Comparison Cards -->
    <g transform="translate(25, 345)">
      <rect width="430" height="145" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="28" fill="#00f5d4" font-size="11" class="mono" font-weight="bold">Why 120Hz Mass-Spring?</text>
      <text x="20" y="52" fill="#cbd5e1" font-size="10">• Instant cut teleportation breaks spatial context and causes disorientation.</text>
      <text x="20" y="74" fill="#cbd5e1" font-size="10">• Linear easing feels floaty and introduces perceptual input lag.</text>
      <text x="20" y="96" fill="#cbd5e1" font-size="10">• Underdamped harmonic physics conveys tactile momentum with quick lock-in.</text>
      <text x="20" y="120" fill="#10b981" font-size="10" class="mono" font-weight="bold">Result: Zero motion sickness, instant muscle memory.</text>
    </g>
  </g>

  <!-- Bottom Annotation Bar -->
  <g transform="translate(600, 680)">
    <rect x="-300" y="-18" width="600" height="36" rx="8" fill="rgba(14, 20, 32, 0.9)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="0" y="4" fill="#94a3b8" font-size="11" class="mono" text-anchor="middle">
      <tspan fill="#00f5d4" font-weight="bold">WinScroller 2D Spring Core:</tspan> Hardware vsync-locked Euler integration at 120 FPS
    </text>
  </g>
</svg>
