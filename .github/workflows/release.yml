name: Release Build & Auto-Publish EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build statically linked release binary
        run: cargo build --release -p winscroller2d

      - name: Package release assets & SHA256 checksums
        shell: pwsh
        run: |
          Copy-Item target\release\winscroller2d.exe .\winscroller2d.exe -Force

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\winscroller2d.exe dist\
          Copy-Item winscroller2d.example.toml dist\
          Copy-Item README.md dist\
          Copy-Item KEYBINDINGS.md dist\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath winscroller2d-x86_64-pc-windows-msvc.zip -Force

          $exeHash = (Get-FileHash .\winscroller2d.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash .\winscroller2d-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  winscroller2d.exe"
            "$zipHash  winscroller2d-x86_64-pc-windows-msvc.zip"
          ) | Set-Content -Path SHA256SUMS.txt -Encoding ASCII

      - name: Update rolling `latest` tag on main push
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push origin refs/tags/latest --force

      - name: Publish rolling `latest` Release (on push to main)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WinScroller 2D — Latest Build
          body: |
            Automated build published directly from commit `${{ github.sha }}` on `main`.

            ### Quick Start (Zero Build Tools Required)
            1. Download **`winscroller2d.exe`** below (or the full `.zip` bundle).
            2. Double-click **`winscroller2d.exe`** — it automatically checks/installs Windows runtime prerequisites, initializes `%APPDATA%\WinScroller2D\winscroller2d.toml`, and requests UAC elevation.
            3. Run `winscroller2d.exe --setup` anytime to verify all runtime and optional developer prerequisites.
          files: |
            winscroller2d.exe
            winscroller2d-x86_64-pc-windows-msvc.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: false

      - name: Publish versioned GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinScroller 2D ${{ github.ref_name }} — Live View Overview Thumbnails Fix
          body_path: RELEASE_NOTES.md
          files: |
            winscroller2d.exe
            winscroller2d-x86_64-pc-windows-msvc.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
