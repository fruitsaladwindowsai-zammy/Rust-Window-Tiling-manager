# WinScroller 2D configuration — Niri scrolling columns/stacks + Hyprscroll2D infinite 2D grid
# Live-reloaded automatically when saved.

[layout]
# Clean borders: 0px edge peek so non-visible windows are cleanly cloaked with zero corner artifacts.
peek_x = 0
peek_y = 0

# Optional: auto-shrink unfocused windows and expand only the focused window.
auto_expand_focused = false
focused_peek_x = 0
focused_peek_y = 0

# Small gaps between adjacent 2D grid cells.
gap_x = 8
gap_y = 8

# Gap between windows split horizontally side-by-side inside the same cell.
stack_gap = 8

# Discrete width and height presets as fractions of (viewport - 2 * peek).
width_steps = [0.50, 0.67, 0.85, 1.00]
height_steps = [0.50, 0.67, 0.85, 1.00]

# 0-based default indices into width_steps / height_steps.
default_width_step = 3   # 1.00 (same full size as highlighted window)
default_height_step = 3  # 1.00 (same full size as highlighted window)

# Where newly opened tiled windows spawn:
# "right_of_focus" | "below_focus" | "rightmost_in_row" | "stack_in_current_cell" | "neighbor_4way"
new_window_placement = "right_of_focus"

# Camera centering behavior:
# "always" (Hyprscroll2D / Niri center-always) | "on_overflow" (Niri minimal scroll)
focus_centering = "always"

# Expand a lone window on a workspace to fill the viewport.
expand_single_window = false
single_window_margin = 12

# Preserve empty spatial holes when moving windows into empty 2D coordinates.
preserve_holes = true

# Automatically compact completely empty rows and columns when windows move or close.
auto_compact_empty = false

# Prevent peeking windows from bleeding onto an adjacent monitor.
clip_cross_monitor_edges = true

# Render live DWM thumbnails in Win+O (`false` resizes actual windows smoothly as fallback).
overview_thumbnails = true

# Scrollable Win+O grid bounds & drag viewport-edge autoscroll speed (px/sec).
overview_min_width = 0.25
overview_min_height = 0.25
overview_autoscroll_speed = 900.0

# Debounced hover-focus when resting the cursor on an edge-peeking window.
hover_focus_peeks = true
hover_focus_delay_ms = 150
center_cursor_on_peek = false

# Precision Touchpad continuous 2D panning (3-finger pan / 4-finger overview toggle).
three_finger_pan = true
four_finger_overview = true
gesture_pan_sensitivity = 1.0
gesture_invert_x = false
gesture_invert_y = false

# Persist workspace coordinates, cell presets, and per-workspace lattice toggles in state.json.
persist_state = true
restore_timeout_secs = 45

[animation]
enabled = true
animate_resize = false
stiffness = 260.0
damping_ratio = 0.72
fps = 120
snap_epsilon_px = 0.5

[appearance]
enable_win11_border = true
active_border_color = "#7AA2F7"
inactive_border_color = "#2F334D"
blur_mode = "pure_blur"
overview_alpha = 0

[workspaces]
names = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
per_monitor_workspaces = true
dynamic_empty_workspace = true

# Window rules (match case-insensitive substrings of exe / class / title)
[[rules]]
exe = "ScreenClippingHost.exe"
ignore = true

[[rules]]
exe = "ShareX.exe"
title = "Region capture"
ignore = true

