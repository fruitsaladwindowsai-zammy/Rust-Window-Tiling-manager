<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow100" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow100" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow100" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes sweepCamera {
      0%, 20% { transform: translate(0, 0); }
      35% { transform: translate(-180px, -120px); }
      50% { transform: translate(180px, -120px); }
      65% { transform: translate(180px, 120px); }
      80% { transform: translate(-180px, 120px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes pulseActiveCell {
      0%, 100% { stroke: #00f5d4; stroke-width: 2.5; fill: rgba(0, 245, 212, 0.25); }
      50% { stroke: #c084fc; stroke-width: 3.5; fill: rgba(192, 132, 252, 0.35); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .anim-frustum { animation: sweepCamera 12s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
    .anim-active-cell { animation: pulseActiveCell 3s infinite ease-in-out; }
    .anim-ring { animation: pulseRing 6s infinite ease-in-out; transform-origin: 600px 375px; }

    text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgGlow100)"/>

  <!-- Acrylic Galaxy Aura -->
  <circle cx="600" cy="375" r="450" fill="url(#coreAura)" class="anim-ring"/>

  <!-- Top Title & Scale Metrics Header -->
  <g transform="translate(600, 42)">
    <rect x="-300" y="-18" width="600" height="36" rx="18" fill="rgba(14, 20, 32, 0.95)" stroke="rgba(0, 245, 212, 0.5)" stroke-width="1.5" filter="url(#shadow100)"/>
    <circle cx="-270" cy="0" r="5" fill="#00f5d4"/>
    <text x="-255" y="4" fill="#f8fafc" font-size="12" font-weight="700">100-Window Extreme Scale Stress Matrix (10×10 Grid)</text>
    <text x="210" y="4" fill="#00f5d4" font-size="10" class="mono" font-weight="bold">120Hz VSync</text>
  </g>

  <!-- 10x10 Matrix Coordinate Field Background -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <!-- Outer boundary of the 100-window coordinate space -->
    <rect x="150" y="80" width="900" height="540" rx="16" fill="rgba(10, 15, 26, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  </g>

