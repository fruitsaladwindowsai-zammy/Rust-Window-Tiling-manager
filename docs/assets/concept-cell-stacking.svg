<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow5" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <filter id="stackShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <style>
    @keyframes stackMorph {
      0%, 40% { transform: translateY(0); opacity: 1; }
      50%, 90% { transform: translateY(-15px) scale(0.98); opacity: 0.6; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .anim-card1 { animation: stackMorph 6s infinite ease-in-out; }
    
    text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="750" fill="url(#bgGlow5)"/>

  <!-- Top Title Badge -->
  <g transform="translate(600, 48)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="rgba(14, 20, 32, 0.95)" stroke="url(#stackGrad)" stroke-width="1.5"/>
    <circle cx="-230" cy="0" r="5" fill="#34d399"/>
    <text x="-215" y="4" fill="#f8fafc" font-size="12" font-weight="700">Niri-Style Cell Stacking &amp; Vertical Split Dynamics</text>
    <text x="195" y="4" fill="#00f5d4" font-size="10" class="mono" font-weight="bold">Win+W</text>
  </g>

  <!-- Left Column: Mode A — Tabbed Stack (Card Deck) -->
  <g transform="translate(120, 110)" filter="url(#stackShadow)">
    <rect width="440" height="520" rx="16" fill="#0c1220" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <rect x="15" y="15" width="410" height="32" rx="8" fill="#151e32"/>
    <text x="30" y="36" fill="#34d399" font-size="12" font-weight="bold">MODE A: TABBED CELL STACK</text>
    <rect x="330" y="21" width="85" height="20" rx="10" fill="rgba(52, 211, 153, 0.15)"/>
    <text x="372" y="35" fill="#34d399" font-size="9" class="mono" text-anchor="middle">ACTIVE</text>

    <!-- Card 3 (Bottom Layer) -->
    <g transform="translate(40, 90)">
      <rect width="360" height="360" rx="12" fill="#080c14" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    </g>

    <!-- Card 2 (Middle Layer) -->
    <g transform="translate(40, 115)">
      <rect width="360" height="360" rx="12" fill="#101726" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>
      <rect x="20" y="15" width="120" height="6" rx="3" fill="#64748b" opacity="0.4"/>
    </g>

    <!-- Card 1 (Top Layer — Active Focused Tab) -->
    <g transform="translate(40, 140)" class="anim-card1">
      <rect width="360" height="360" rx="12" fill="#162035" stroke="url(#stackGrad)" stroke-width="2"/>
      <path d="M 0 12 Q 0 0 12 0 L 348 0 Q 360 0 360 12 L 360 32 L 0 32 Z" fill="#1f2c48"/>
      <circle cx="16" cy="16" r="4" fill="#ef4444"/>
      <circle cx="28" cy="16" r="4" fill="#f59e0b"/>
      <circle cx="40" cy="16" r="4" fill="#10b981"/>
      <text x="56" y="20" fill="#34d399" font-size="11" class="mono">Tab 1: Focused Editor (Top of Deck)</text>

      <!-- Content -->
      <g class="mono" font-size="10" fill="#94a3b8">
        <text x="20" y="60" fill="#f43f5e">Consume with Win+, | Expel with Win+.</text>
        <text x="20" y="85" fill="#cbd5e1">Non-top tabs are automatically cloaked via DWM.</text>
        <text x="20" y="110" fill="#cbd5e1">Cycle stack order: Win+Tab or Win+J/K</text>
        
        <rect x="20" y="130" width="320" height="180" rx="8" fill="rgba(52, 211, 153, 0.05)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1"/>
        <text x="35" y="160" fill="#34d399" font-size="11" font-weight="bold">DWM Tab Cloaking Lifecycle</text>
        <text x="35" y="185">Top Window: DWMWA_CLOAK = FALSE</text>
        <text x="35" y="205">Background Windows: DWMWA_CLOAK = TRUE</text>
        <text x="35" y="225">Zero memory footprint increase per stack</text>
        <text x="35" y="250" fill="#00f5d4">Press Win+W to switch to Vertical Split</text>
      </g>
    </g>
  </g>

  <!-- Toggle Icon Arrow in Center -->
  <g transform="translate(600, 370)">
    <circle cx="0" cy="0" r="28" fill="#090d16" stroke="url(#stackGrad)" stroke-width="2"/>
    <text x="0" y="6" fill="#00f5d4" font-size="14" font-weight="bold" text-anchor="middle">⇄</text>
    <rect x="-45" y="38" width="90" height="20" rx="10" fill="#141c2c" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="0" y="52" fill="#e2e8f0" font-size="9" class="mono" text-anchor="middle">Win + W</text>
  </g>

  <!-- Right Column: Mode B — Vertical Split -->
  <g transform="translate(640, 110)" filter="url(#stackShadow)">
    <rect width="440" height="520" rx="16" fill="#0c1220" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <rect x="15" y="15" width="410" height="32" rx="8" fill="#151e32"/>
    <text x="30" y="36" fill="#00f5d4" font-size="12" font-weight="bold">MODE B: VERTICAL SPLIT CELL</text>
    <rect x="330" y="21" width="85" height="20" rx="10" fill="rgba(0, 245, 212, 0.15)"/>
    <text x="372" y="35" fill="#00f5d4" font-size="9" class="mono" text-anchor="middle">ACTIVE</text>

    <!-- Top Split Window: 50% Height -->
    <g transform="translate(25, 65)">
      <rect width="390" height="210" rx="10" fill="#111827" stroke="rgba(0, 245, 212, 0.4)" stroke-width="1.5"/>
      <path d="M 0 10 Q 0 0 10 0 L 380 0 Q 390 0 390 10 L 390 28 L 0 28 Z" fill="#182235"/>
      <circle cx="14" cy="14" r="3.5" fill="#ef4444"/>
      <circle cx="25" cy="14" r="3.5" fill="#f59e0b"/>
      <circle cx="36" cy="14" r="3.5" fill="#10b981"/>
      <text x="50" y="18" fill="#00f5d4" font-size="10" class="mono">Split Top (50% H): Editor</text>

      <g class="mono" font-size="10" fill="#cbd5e1">
        <text x="20" y="55">Height: 50% of work area minus gap/2</text>
        <text x="20" y="75" fill="#64748b">fn handle_key_event(&amp;mut self, key: KeyCode)</text>
        <text x="20" y="95" fill="#64748b">match key { KeyCode::Char('o') =&gt; ... }</text>
      </g>
    </g>

    <!-- Horizontal Split Divider -->
    <g transform="translate(25, 285)">
      <line x1="0" y1="0" x2="390" y2="0" stroke="#00f5d4" stroke-width="2"/>
      <circle cx="195" cy="0" r="5" fill="#00f5d4"/>
    </g>

    <!-- Bottom Split Window: 50% Height -->
    <g transform="translate(25, 295)">
      <rect width="390" height="210" rx="10" fill="#0d1422" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
      <path d="M 0 10 Q 0 0 10 0 L 380 0 Q 390 0 390 10 L 390 28 L 0 28 Z" fill="#161c2d"/>
      <circle cx="14" cy="14" r="3.5" fill="#ef4444"/>
      <circle cx="25" cy="14" r="3.5" fill="#f59e0b"/>
      <circle cx="36" cy="14" r="3.5" fill="#10b981"/>
      <text x="50" y="18" fill="#c084fc" font-size="10" class="mono">Split Bottom (50% H): Terminal / Logs</text>

      <g class="mono" font-size="10" fill="#10b981">
        <text x="20" y="55">cargo test -p winscroller2d-core</text>
        <text x="20" y="75" fill="#e2e8f0">test result: ok. 24 passed in 0.12s</text>
        <text x="20" y="95" fill="#94a3b8">Both windows scroll synchronously in column</text>
      </g>
    </g>
  </g>

  <!-- Bottom Annotation Bar -->
  <g transform="translate(600, 680)">
    <rect x="-300" y="-18" width="600" height="36" rx="8" fill="rgba(14, 20, 32, 0.9)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="0" y="4" fill="#94a3b8" font-size="11" class="mono" text-anchor="middle">
      <tspan fill="#34d399" font-weight="bold">Niri-Style Stacking:</tspan> Consume multiple applications into one column cell without clutter
    </text>
  </g>
</svg>
