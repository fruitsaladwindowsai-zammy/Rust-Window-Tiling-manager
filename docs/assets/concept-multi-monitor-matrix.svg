<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowMulti" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="monGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <linearGradient id="monGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="monGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>

    <filter id="shadowMulti" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes transferFlow {
      0% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(340px); opacity: 0; }
    }
    @keyframes pulseEdge {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; stroke-width: 3; }
    }
    .anim-flow { animation: transferFlow 3.5s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .anim-edge { animation: pulseEdge 2.5s infinite ease-in-out; }

    text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="750" fill="url(#bgGlowMulti)"/>

  <!-- Top Title Badge -->
  <g transform="translate(600, 42)">
    <rect x="-320" y="-18" width="640" height="36" rx="18" fill="rgba(14, 20, 32, 0.95)" stroke="url(#monGrad1)" stroke-width="1.5" filter="url(#shadowMulti)"/>
    <circle cx="-290" cy="0" r="5" fill="#00f5d4"/>
    <text x="-275" y="4" fill="#f8fafc" font-size="12" font-weight="700">Multi-Monitor Extended Workspace (Dual 4K + Vertical Ultrawide)</text>
    <text x="215" y="4" fill="#00f5d4" font-size="10" class="mono" font-weight="bold">Zero Spillover</text>
  </g>

  <!-- ==================== DISPLAY 1: LEFT VERTICAL MONITOR (CODE / DOCS) ==================== -->
  <g transform="translate(60, 100)" filter="url(#shadowMulti)">
    <rect width="260" height="520" rx="14" fill="#090d16" stroke="url(#monGrad3)" stroke-width="2"/>
    <rect x="8" y="8" width="244" height="504" rx="10" fill="#050810"/>
    
    <rect x="15" y="15" width="230" height="26" rx="6" fill="#151e30"/>
    <text x="25" y="32" fill="#ffaa00" font-size="10" class="mono" font-weight="bold">MONITOR 1 (Vertical 4K)</text>

    <!-- Vertical Column Windows -->
    <g transform="translate(18, 55)">
      <!-- Win 1 -->
      <rect x="0" y="0" width="224" height="135" rx="8" fill="#101726" stroke="rgba(255, 170, 0, 0.4)" stroke-width="1.5"/>
      <rect x="10" y="10" width="120" height="8" rx="4" fill="#ffaa00" opacity="0.8"/>
      <rect x="10" y="26" width="180" height="5" rx="2.5" fill="#64748b" opacity="0.4"/>
      <rect x="10" y="38" width="140" height="5" rx="2.5" fill="#64748b" opacity="0.4"/>
      <rect x="10" y="50" width="160" height="5" rx="2.5" fill="#64748b" opacity="0.4"/>
      <text x="10" y="115" fill="#ffaa00" font-size="9" class="mono">Cell (0, 0) Neovim</text>

      <!-- Win 2 -->
      <rect x="0" y="145" width="224" height="135" rx="8" fill="#101726" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <rect x="10" y="155" width="140" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
      <rect x="10" y="171" width="160" height="5" rx="2.5" fill="#64748b" opacity="0.4"/>
      <rect x="10" y="183" width="190" height="5" rx="2.5" fill="#64748b" opacity="0.4"/>
      <text x="10" y="260" fill="#94a3b8" font-size="9" class="mono">Cell (0, 1) Cargo Test</text>

      <!-- Win 3 -->
      <rect x="0" y="290" width="224" height="150" rx="8" fill="#101726" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <rect x="10" y="300" width="110" height="8" rx="4" fill="#34d399" opacity="0.8"/>
      <rect x="10" y="316" width="170" height="5" rx="2.5" fill="#64748b" opacity="0.4"/>
      <text x="10" y="420" fill="#94a3b8" font-size="9" class="mono">Cell (0, 2) DB Profiler</text>
    </g>
  </g>

  <!-- Boundary Line 1 -->
  <g transform="translate(335, 100)">
    <line x1="0" y1="0" x2="0" y2="520" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" class="anim-edge"/>
    <rect x="-35" y="250" width="70" height="20" rx="10" fill="#07090e" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="264" fill="#f59e0b" font-size="8" class="mono" font-weight="bold" text-anchor="middle">0px EDGE</text>
  </g>

  <!-- ==================== DISPLAY 2: CENTER PRIMARY ULTRAWIDE (DEV WORKSTATION) ==================== -->
  <g transform="translate(350, 100)" filter="url(#shadowMulti)">
    <rect width="500" height="520" rx="14" fill="#090d16" stroke="url(#monGrad1)" stroke-width="2"/>
    <rect x="8" y="8" width="484" height="504" rx="10" fill="#050810"/>

    <rect x="15" y="15" width="470" height="26" rx="6" fill="#151e30"/>
    <text x="25" y="32" fill="#00f5d4" font-size="10" class="mono" font-weight="bold">MONITOR 2 (Primary 3840×2160 @ 120Hz — 2D Matrix)</text>

    <!-- Center Display 2D Grid Cells -->
    <g transform="translate(20, 55)">
      <!-- Main Active Window (1, 0) -->
      <rect x="0" y="0" width="225" height="215" rx="10" fill="#0d1424" stroke="#00f5d4" stroke-width="2"/>
      <rect x="12" y="12" width="130" height="10" rx="5" fill="#00f5d4"/>
      <text x="12" y="45" fill="#00f5d4" font-size="10" class="mono" font-weight="bold">Focus: Terminal (1, 0)</text>
      <text x="12" y="65" fill="#10b981" font-size="9" class="mono">Compiling winscroller2d...</text>
      <text x="12" y="85" fill="#cbd5e1" font-size="9" class="mono">120Hz Spring VSync Locked</text>
      <rect x="12" y="105" width="200" height="90" rx="6" fill="rgba(0, 245, 212, 0.05)" stroke="rgba(0, 245, 212, 0.2)" stroke-width="1"/>
      <text x="20" y="130" fill="#00f5d4" font-size="9" class="mono">DWM Acrylic Clear Active</text>
      <text x="20" y="150" fill="#94a3b8" font-size="8" class="mono">Win+Alt+Left/Right: Monitor Jump</text>
      <text x="20" y="170" fill="#10b981" font-size="8" class="mono">Zero Spillover: CLOAKED</text>

      <!-- Window (2, 0) -->
      <rect x="235" y="0" width="225" height="215" rx="10" fill="#101726" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <rect x="247" y="12" width="110" height="10" rx="5" fill="#38bdf8"/>
      <text x="247" y="45" fill="#38bdf8" font-size="10" class="mono">Browser: Live Demos (2, 0)</text>
      <rect x="247" y="60" width="200" height="14" rx="4" fill="rgba(255,255,255,0.06)"/>

      <!-- Window (1, 1) - Bottom Left -->
      <rect x="0" y="225" width="225" height="215" rx="10" fill="#101726" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="12" y="250" fill="#c084fc" font-size="10" class="mono">Docs &amp; Specs (1, 1)</text>

      <!-- Window (2, 1) - Bottom Right -->
      <rect x="235" y="225" width="225" height="215" rx="10" fill="#101726" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="247" y="250" fill="#10b981" font-size="10" class="mono">System Monitor (2, 1)</text>
    </g>
  </g>

  <!-- Boundary Line 2 -->
  <g transform="translate(865, 100)">
    <line x1="0" y1="0" x2="0" y2="520" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 4" class="anim-edge"/>
    <rect x="-35" y="250" width="70" height="20" rx="10" fill="#07090e" stroke="#c084fc" stroke-width="1"/>
    <text x="0" y="264" fill="#c084fc" font-size="8" class="mono" font-weight="bold" text-anchor="middle">0px EDGE</text>
  </g>

  <!-- ==================== DISPLAY 3: RIGHT SECONDARY 4K (COMMUNICATION / MEDIA) ==================== -->
  <g transform="translate(880, 100)" filter="url(#shadowMulti)">
    <rect width="260" height="520" rx="14" fill="#090d16" stroke="url(#monGrad2)" stroke-width="2"/>
    <rect x="8" y="8" width="244" height="504" rx="10" fill="#050810"/>

    <rect x="15" y="15" width="230" height="26" rx="6" fill="#151e30"/>
    <text x="25" y="32" fill="#c084fc" font-size="10" class="mono" font-weight="bold">MONITOR 3 (Comm / Media)</text>

    <!-- Communication Windows -->
    <g transform="translate(18, 55)">
      <!-- Win 1: Slack/Discord -->
      <rect x="0" y="0" width="224" height="215" rx="8" fill="#101726" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
      <text x="12" y="25" fill="#c084fc" font-size="10" class="mono">#dev-standup (0, 0)</text>
      <rect x="12" y="38" width="200" height="22" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="12" y="68" width="200" height="22" rx="4" fill="rgba(255,255,255,0.05)"/>

      <!-- Win 2: Media / Stream -->
      <rect x="0" y="225" width="224" height="215" rx="8" fill="#101726" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="12" y="250" fill="#94a3b8" font-size="10" class="mono">OBS / Stream (0, 1)</text>
    </g>
  </g>

  <!-- Cross-Monitor Transfer Particle Ray -->
  <g transform="translate(420, 260)" class="anim-flow">
    <rect width="110" height="40" rx="8" fill="rgba(0, 245, 212, 0.25)" stroke="#00f5d4" stroke-width="2"/>
    <text x="55" y="24" fill="#ffffff" font-size="9" class="mono" font-weight="bold" text-anchor="middle">Win+Alt+→</text>
  </g>

  <!-- Bottom Global Summary Telemetry -->
  <g transform="translate(150, 645)">
    <rect x="0" y="0" width="900" height="65" rx="10" fill="rgba(14, 20, 32, 0.9)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="25" y="25" fill="#64748b" font-size="10" class="mono">MULTI-MONITOR TOPOLOGY</text>
    <text x="25" y="48" fill="#00f5d4" font-size="16" font-weight="bold">3 Active Monitors | 54 Windows Managed Across Displays</text>
    <text x="580" y="38" fill="#94a3b8" font-size="10" class="mono">Per-Monitor V2 DPI Awareness: 100% / 150% / 200% Crisp</text>
  </g>
</svg>
