<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow7" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>

    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes cyclePreset {
      0%, 20% { stroke: #00f5d4; }
      25%, 45% { stroke: #c084fc; }
      50%, 70% { stroke: #f59e0b; }
      75%, 95% { stroke: #34d399; }
      100% { stroke: #00f5d4; }
    }
    .anim-cycle { animation: cyclePreset 10s infinite; }
    
    text { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="750" fill="url(#bgGlow7)"/>

  <!-- Top Title Badge -->
  <g transform="translate(600, 48)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(14, 20, 32, 0.95)" stroke="url(#hudGrad)" stroke-width="1.5"/>
    <circle cx="-210" cy="0" r="5" fill="#f59e0b"/>
    <text x="-195" y="4" fill="#f8fafc" font-size="12" font-weight="700">Layout Preset Selector HUD Overlay</text>
    <text x="175" y="4" fill="#f59e0b" font-size="10" class="mono" font-weight="bold">Presets HUD</text>
  </g>

  <!-- Holographic Floating HUD Container -->
  <g transform="translate(150, 110)" filter="url(#hudShadow)">
    <rect width="900" height="520" rx="18" fill="rgba(12, 17, 30, 0.95)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    
    <!-- HUD Header -->
    <rect x="20" y="20" width="860" height="36" rx="8" fill="#151e33"/>
    <circle cx="40" cy="38" r="4" fill="#ef4444"/>
    <circle cx="52" cy="38" r="4" fill="#f59e0b"/>
    <circle cx="64" cy="38" r="4" fill="#10b981"/>
    <text x="80" y="42" fill="#e2e8f0" font-size="12" font-weight="bold">WINSCROLLER 2D — TOPOLOGY PRESETS SELECTOR</text>
    <text x="860" y="42" fill="#64748b" font-size="10" class="mono" text-anchor="end">Cycle with Win+Alt+L</text>

    <!-- 4 Preset Grid Cards -->

    <!-- Preset 1: Column Ribbon (1D Niri style) -->
    <g transform="translate(40, 80)">
      <rect width="390" height="200" rx="12" fill="#0d1424" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
      <rect x="15" y="15" width="360" height="24" rx="6" fill="#141c2c"/>
      <text x="25" y="31" fill="#38bdf8" font-size="11" font-weight="bold">PRESET 1: COLUMN RIBBON (1D HORIZONTAL)</text>
      
      <!-- Ribbon mini columns -->
      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="80" height="110" rx="6" fill="#1a253a" stroke="#38bdf8" stroke-width="1"/>
        <rect x="95" y="0" width="130" height="110" rx="6" fill="#1e2c45" stroke="#38bdf8" stroke-width="2"/>
        <rect x="240" y="0" width="80" height="110" rx="6" fill="#1a253a" stroke="#38bdf8" stroke-width="1"/>
        <text x="160" y="60" fill="#38bdf8" font-size="9" class="mono" text-anchor="middle">Active Focus</text>
      </g>
    </g>

    <!-- Preset 2: Balanced 2D Lattice (Default WinScroller) -->
    <g transform="translate(470, 80)">
      <rect width="390" height="200" rx="12" fill="#0d1424" stroke="#00f5d4" stroke-width="2"/>
      <rect x="15" y="15" width="360" height="24" rx="6" fill="#141c2c"/>
      <text x="25" y="31" fill="#00f5d4" font-size="11" font-weight="bold">PRESET 2: BALANCED 2D LATTICE [RECOMMENDED]</text>

      <!-- 2D matrix mini cells -->
      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="95" height="50" rx="6" fill="#1a253a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <rect x="110" y="0" width="120" height="50" rx="6" fill="#1a253a" stroke="#00f5d4" stroke-width="2"/>
        <rect x="245" y="0" width="85" height="50" rx="6" fill="#1a253a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

        <rect x="0" y="60" width="95" height="50" rx="6" fill="#1a253a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <rect x="110" y="60" width="120" height="50" rx="6" fill="#1a253a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <rect x="245" y="60" width="85" height="50" rx="6" fill="#1a253a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <text x="170" y="30" fill="#00f5d4" font-size="9" class="mono" text-anchor="middle">(1, 0) Focus</text>
      </g>
    </g>

    <!-- Preset 3: Focus Master (Centered Giant + Peripheral Peekers) -->
    <g transform="translate(40, 300)">
      <rect width="390" height="200" rx="12" fill="#0d1424" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
      <rect x="15" y="15" width="360" height="24" rx="6" fill="#141c2c"/>
      <text x="25" y="31" fill="#c084fc" font-size="11" font-weight="bold">PRESET 3: FOCUS MASTER (70% HERO)</text>

      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="50" height="110" rx="6" fill="#161f31" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <rect x="65" y="0" width="200" height="110" rx="6" fill="#201838" stroke="#c084fc" stroke-width="2"/>
        <rect x="280" y="0" width="50" height="110" rx="6" fill="#161f31" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="165" y="60" fill="#c084fc" font-size="10" class="mono" text-anchor="middle">Hero (70% W)</text>
      </g>
    </g>

    <!-- Preset 4: Custom Sparse Grid (Hole-Preserving Coordinates) -->
    <g transform="translate(470, 300)">
      <rect width="390" height="200" rx="12" fill="#0d1424" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
      <rect x="15" y="15" width="360" height="24" rx="6" fill="#141c2c"/>
      <text x="25" y="31" fill="#f59e0b" font-size="11" font-weight="bold">PRESET 4: CUSTOM SPARSE HOLE-PRESERVING</text>

      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="95" height="50" rx="6" fill="#1e1828" stroke="#f59e0b" stroke-width="1"/>
        <!-- Hole at (1, 0) -->
        <rect x="110" y="0" width="120" height="50" rx="6" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="170" y="30" fill="rgba(245, 158, 11, 0.5)" font-size="9" class="mono" text-anchor="middle">[HOLE PRESERVED]</text>

        <rect x="245" y="0" width="85" height="50" rx="6" fill="#1e1828" stroke="#f59e0b" stroke-width="1"/>
        <rect x="110" y="60" width="120" height="50" rx="6" fill="#1e1828" stroke="#f59e0b" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Bottom Annotation Bar -->
  <g transform="translate(600, 680)">
    <rect x="-300" y="-18" width="600" height="36" rx="8" fill="rgba(14, 20, 32, 0.9)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="0" y="4" fill="#94a3b8" font-size="11" class="mono" text-anchor="middle">
      <tspan fill="#f59e0b" font-weight="bold">Layout Selector HUD:</tspan> Switch window arrangements instantly on the fly without restarting
    </text>
  </g>
</svg>
