[book]
title = "WinScroller 2D"
description = "Native Windows 10/11 2D Scrolling & Tiling Window Manager written in Rust"
authors = ["WinScroller 2D contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/fruitsaladwindowsai-zammy/Winscroller-2D"
edit-url-template = "https://github.com/fruitsaladwindowsai-zammy/Winscroller-2D/edit/main/docs/{path}"
